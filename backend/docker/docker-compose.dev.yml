# 本地开发：Postgres、Redis、Inbucket、MinIO，以及 @tide/admin 的 Vite。
# 后端 API 不在这里，在宿主机用 mvn 起在 8000。
#
#   cp .env.example .env   # 改掉占位密码
#   docker compose --env-file .env -f docker-compose.dev.yml up
#
# 本文件只写 ${VAR}。真实密码放 .env，且不要提交。

name: tide-dev

services:
  db:
    image: postgres:17.6-alpine
    restart: "no"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      # 匿名卷：不把数据写进仓库。删容器并 down -v 后是一套空库（同 Supabase dev）。
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: "no"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_PWD: ${REDIS_PWD:?set REDIS_PWD in .env}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PWD" --save "" --appendonly no
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PWD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # SMTP 只收信，不外发。Web UI 看验证码。端口与 scripts/container/mail 一致。
  mail:
    image: inbucket/inbucket:3.0.3
    restart: "no"
    ports:
      - "2500:2500"
      - "9000:9000"
      - "1100:1100"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - mail_data:/storage

  minio:
    image: cgr.dev/chainguard/minio
    restart: "no"
    # 容器内仍是 9000/9001。宿主机 9000 已被 Inbucket 占用，API 映射到 9002。
    command:
      - server
      - --console-address
      - ":9001"
      - /data
    ports:
      - "${MINIO_API_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 10s
      retries: 15
      start_period: 5s

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:?set MINIO_BUCKET in .env}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"

  # Vite HMR。绑定挂载 frontend/，这样不带 --watch 的 up 也能热更新。
  # develop.watch 只在 `up --watch` 时生效，和这里的启动命令不一致，所以不用它。
  # 根 node_modules 用匿名卷，避免容器里的 Linux 依赖盖住宿主机安装。
  web:
    image: node:22-bookworm
    restart: "no"
    working_dir: /app
    init: true
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        corepack enable
        export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
        PNPM_SPEC=$$(node -p 'require("./package.json").packageManager')
        corepack prepare "$$PNPM_SPEC" --activate
        CI=true pnpm install
        exec pnpm -F @tide/admin run dev -- --host 0.0.0.0 --port 5888
    ports:
      - "${VITE_PORT:-5888}:5888"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 容器内固定 5888。VITE_PORT 只改宿主机映射，避免和端口发布错位。
      VITE_PORT: "5888"
      VITE_GLOB_API_URL: ${VITE_GLOB_API_URL:-http://host.docker.internal:8000}
      NPM_CONFIG_STORE_DIR: /pnpm/store
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../frontend:/app
      - /app/node_modules
      - web_pnpm_store:/pnpm/store

volumes:
  mail_data:
  minio_data:
  web_pnpm_store:
