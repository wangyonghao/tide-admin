# 本地开发：Postgres、Redis、Inbucket、MinIO、Spring Boot API、@tide/admin 的 Vite。
#
#   cp .env.example .env   # 改掉占位密码和 AES_KEY
#   docker compose --env-file .env -f docker-compose.dev.yml up
#
# 本文件只写 ${VAR}。真实密码放 .env，且不要提交。

name: wyh-dev

services:
  db:
    image: postgres:17.6-alpine
    restart: "no"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      # 匿名卷：不把数据写进仓库。删容器并 down -v 后是一套空库（同 Supabase dev）。
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: "no"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_PWD: ${REDIS_PWD:?set REDIS_PWD in .env}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PWD" --save "" --appendonly no
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PWD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # SMTP 只收信，不外发。Web UI 看验证码。端口与 scripts/container/mail 一致。
  mail:
    image: inbucket/inbucket:3.0.3
    restart: "no"
    ports:
      - "2500:2500"
      - "9000:9000"
      - "1100:1100"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - mail_data:/storage

  minio:
    image: cgr.dev/chainguard/minio
    restart: "no"
    # 容器内仍是 9000/9001。宿主机 9000 已被 Inbucket 占用，API 映射到 9002。
    command:
      - server
      - --console-address
      - ":9001"
      - /data
    ports:
      - "${MINIO_API_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 10s
      retries: 15
      start_period: 5s

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:?set MINIO_BUCKET in .env}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"

  # Spring Boot。源码挂载 + Maven 仓库卷；镜像只提供 Temurin 17 和入口脚本。
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: wyh-dev-api:dev
    restart: "no"
    init: true
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 容器内固定 8000。API_PORT 只改宿主机映射。Vite 代理用的是容器端口。
      SERVER_PORT: "8000"
      SPRING_PROFILES_ACTIVE: dev
      SPRING_LIQUIBASE_ENABLED: ${SPRING_LIQUIBASE_ENABLED:-true}
      AES_KEY: ${AES_KEY:?set AES_KEY in .env (16, 24, or 32 bytes)}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-${POSTGRES_DB:-postgres}}
      DB_USER: ${DB_USER:-${POSTGRES_USER:-postgres}}
      DB_PWD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_HOST: ${REDIS_HOST:-redis}
      # 容器内 Redis 固定 6379。REDIS_PORT 只发布到宿主机。
      REDIS_PORT: "6379"
      REDIS_PWD: ${REDIS_PWD:?set REDIS_PWD in .env}
      REDIS_DB: ${REDIS_DB:-15}
      FILE_STORAGE_TYPE: ${FILE_STORAGE_TYPE:-MINIO}
      FILE_MINIO_ENDPOINT: ${FILE_MINIO_ENDPOINT:-http://minio:9000}
      FILE_MINIO_ACCESS_KEY: ${FILE_MINIO_ACCESS_KEY:-${MINIO_ROOT_USER}}
      FILE_MINIO_SECRET_KEY: ${FILE_MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD}}
      FILE_MINIO_BUCKET: ${FILE_MINIO_BUCKET:-${MINIO_BUCKET}}
      FILE_LOCAL_ROOT_PATH: ${FILE_LOCAL_ROOT_PATH:-/data/files}
      APPLICATION_URL: http://localhost:${VITE_PORT:-5888}
      API_HOT_RELOAD: ${API_HOT_RELOAD:-true}
      WYH_JWT_SECRET: ${WYH_JWT_SECRET:?set WYH_JWT_SECRET in .env}
      LOGGING_FILE_PATH: /tmp/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # 首次要下载依赖并编译。失败在 start_period 内不计次，起来之后 /dev/tcp 探活。
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/8000'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 900s
    volumes:
      - ..:/src
      - api_m2:/root/.m2
      - api_files:/data/files

  # Vite HMR。绑定挂载 frontend/，这样不带 --watch 的 up 也能热更新。
  # develop.watch 只在 `up --watch` 时生效，和这里的启动命令不一致，所以不用它。
  # 根 node_modules 用匿名卷，避免容器里的 Linux 依赖盖住宿主机安装。
  web:
    image: node:22-bookworm
    restart: "no"
    working_dir: /app
    init: true
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        corepack enable
        export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
        PNPM_SPEC=$$(node -p 'require("./package.json").packageManager')
        corepack prepare "$$PNPM_SPEC" --activate
        CI=true pnpm install
        exec pnpm -F @tide/admin run dev -- --host 0.0.0.0 --port 5888
    ports:
      - "${VITE_PORT:-5888}:5888"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 容器内固定 5888。VITE_PORT 只改宿主机映射，避免和端口发布错位。
      VITE_PORT: "5888"
      VITE_GLOB_API_URL: ${VITE_GLOB_API_URL:-http://api:8000}
      NPM_CONFIG_STORE_DIR: /pnpm/store
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    # 默认代理到 api:8000。改回宿主机后端时才用到 host.docker.internal。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../frontend:/app
      - /app/node_modules
      - web_pnpm_store:/pnpm/store

volumes:
  mail_data:
  minio_data:
  web_pnpm_store:
  api_m2:
  api_files:
