name: Backend Build

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jdk-version:
          - 17
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "adopt"
          java-version: ${{ matrix.jdk-version }}
          cache: "maven"
      - name: Compile
        run: |
          sed -i.bak '/<repositories>/,/<\/repositories>/d' ./backend/pom.xml
          sed -i.bak '/<pluginRepositories>/,/<\/pluginRepositories>/d' ./backend/pom.xml
          mvn -B compile --file ./backend/pom.xml
